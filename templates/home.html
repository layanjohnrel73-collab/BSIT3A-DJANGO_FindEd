{% extends "theme/base.html" %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
{% endblock %}
{% block content %}
{{ gate|json_script:"kcc-gate" }}
<style>
  .gps-finder { max-width: 760px; margin: 0 auto; background: #050607; border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(15,23,42,.25); box-shadow: 0 24px 70px rgba(15,23,42,.28); color: #f8fafc; }
  .gps-appbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px;
    padding: 12px 14px; background: #050607; }
  .gps-title { text-align: center; font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
  .gps-icon-btn { width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center;
    justify-content: center; color: #e2e8f0; background: transparent; border: 0; text-decoration: none; }
  .gps-icon-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
  .gps-actions { display: flex; gap: 8px; padding: 0 14px 12px; background: #050607; }
  .gps-action { flex: 1; min-height: 48px; border-radius: 10px; border: 1px solid #30343a; background: #1b1e22;
    color: #e5e7eb; font-size: 14px; font-weight: 800; letter-spacing: .06em; display: flex; align-items: center;
    justify-content: center; gap: 8px; }
  .gps-action.start { background: #24272b; }
  .gps-action.stop { background: #ef4444; border-color: #ef4444; color: #fff; }
  .gps-action.icon { flex: 0 0 52px; }
  .gps-action:disabled { opacity: .42; cursor: not-allowed; }
  .gps-action:not(:disabled):hover { filter: brightness(1.08); }
  .gps-map-wrap { position: relative; background: #e5e7eb; }
  #gps-map { width: 100%; height: clamp(430px, 64vh, 620px); }
  .gps-map-controls { position: absolute; top: 12px; right: 12px; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
  .gps-map-controls button { width: 42px; height: 42px; border-radius: 50%; background: rgba(18,20,23,.92);
    color: #fff; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 6px 16px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center; font-size: 15px; backdrop-filter: blur(8px); }
  .gps-map-controls button:hover { background: #25282d; }
  .gps-map-controls button.active { background: #2563eb; border-color: #60a5fa; }
  .gps-status { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 5; display: flex;
    align-items: center; gap: 10px; padding: 10px 12px; background: rgba(5,6,7,.94);
    border: 1px solid rgba(255,255,255,.14); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
    backdrop-filter: blur(10px); }
  .gps-status .status-icon { width: 26px; height: 26px; border-radius: 50%; background: #2563eb; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; flex: 0 0 26px; }
  .gps-status .status-text { flex: 1; font-size: 13px; line-height: 1.25; color: #e5e7eb; }
  .gps-status .status-text small { display: block; margin-top: 2px; color: #94a3b8; font-size: 11px; }
  .gps-status .status-target { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.06); color: #fff; display: flex; align-items: center; justify-content: center;
    flex: 0 0 36px; }
  .gps-status .status-target:hover { background: rgba(255,255,255,.14); }
  .gps-dot { position: relative; width: 24px; height: 24px; border-radius: 50%; background: #2563eb;
    border: 3px solid #fff; box-shadow: 0 0 0 8px rgba(37,99,235,.25), 0 8px 20px rgba(0,0,0,.35); }
  .gps-dot::after { content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 2px solid rgba(37,99,235,.55); animation: gpsPulse 2s ease-out infinite; }
  @keyframes gpsPulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.8); opacity: 0; } }
  .gps-toast { position: absolute; left: 50%; bottom: 80px; z-index: 6; transform: translate(-50%, 8px);
    background: rgba(8,10,12,.95); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 12px;
    font-weight: 700; padding: 8px 14px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: .2s; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
  .gps-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .maplibregl-ctrl-attrib { font-size: 10px !important; background: rgba(8,10,12,.72) !important; color: #cbd5e1 !important; }
  .maplibregl-ctrl-attrib a { color: #93c5fd !important; }
  @media (max-width: 575.98px) {
    .gps-finder { margin: 0 -.75rem; border-radius: 0; }
    #gps-map { height: calc(100vh - 260px); min-height: 420px; }
  }
</style>

<div class="gps-finder">
  <div class="gps-appbar">
    <a href="{% url 'dashboard' %}" class="gps-icon-btn" aria-label="Back to dashboard"><i class="fas fa-bars"></i></a>
    <div class="gps-title">Real Time GPS Tracker</div>
    <button id="gps-share-top" class="gps-icon-btn" type="button" aria-label="Share location"><i class="fas fa-share-nodes"></i></button>
  </div>

  <div class="gps-actions">
    <button id="gps-start" class="gps-action start" type="button"><i class="fas fa-play"></i> START</button>
    <button id="gps-stop" class="gps-action stop" type="button" disabled><i class="fas fa-stop"></i> STOP</button>
    <button id="gps-share" class="gps-action icon" type="button" aria-label="Share location"><i class="fas fa-share-nodes"></i></button>
  </div>

  <div class="gps-map-wrap">
    <div id="gps-map"></div>

    <div class="gps-map-controls">
      <button id="gps-layers" type="button" title="Map layers" aria-label="Map layers"><i class="fas fa-layer-group"></i></button>
      <button id="gps-compass" type="button" title="Reset compass" aria-label="Reset compass"><i class="fas fa-compass"></i></button>
      <button id="gps-recenter" type="button" title="Recenter" aria-label="Recenter"><i class="fas fa-location-crosshairs"></i></button>
    </div>

    <div class="gps-status">
      <span class="status-icon" id="gps-status-icon"><i class="fas fa-circle-info"></i></span>
      <span class="status-text" id="gps-status-text">Lost GPS signal. Getting LBS data<small id="gps-status-sub">Showing KCC campus until GPS is available.</small></span>
      <button class="status-target" id="gps-status-recenter" type="button" aria-label="Recenter map"><i class="fas fa-location-crosshairs"></i></button>
    </div>

    <div class="gps-toast" id="gps-toast"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  'use strict';

  const KCC = JSON.parse(document.getElementById('kcc-gate').textContent);
  const startBtn = document.getElementById('gps-start');
  const stopBtn = document.getElementById('gps-stop');
  const shareBtn = document.getElementById('gps-share');
  const shareTopBtn = document.getElementById('gps-share-top');
  const layersBtn = document.getElementById('gps-layers');
  const compassBtn = document.getElementById('gps-compass');
  const recenterBtn = document.getElementById('gps-recenter');
  const statusRecentBtn = document.getElementById('gps-status-recenter');
  const statusIcon = document.getElementById('gps-status-icon');
  const statusText = document.getElementById('gps-status-text');
  const toastEl = document.getElementById('gps-toast');

  let map;
  let marker;
  let watchId = null;
  let watching = false;
  let follow = true;
  let satellite = false;
  let livePos = null;
  let liveAccuracy = null;
  let toastTimer = null;

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2800);
  }

  function setStatus(title, sub, mode) {
    statusText.innerHTML = title + (sub ? '<small>' + sub + '</small>' : '');
    statusIcon.style.background = mode === 'live' ? '#16a34a' : mode === 'off' ? '#64748b' : '#2563eb';
    statusIcon.innerHTML = '<i class="fas ' +
      (mode === 'live' ? 'fa-satellite-dish' : mode === 'off' ? 'fa-power-off' : 'fa-circle-info') + '"></i>';
  }

  function circlePolygon(lat, lng, radius) {
    const R = 6378137;
    const dLat = radius / R * 180 / Math.PI;
    const dLng = radius / (R * Math.cos(lat * Math.PI / 180)) * 180 / Math.PI;
    const coords = [];
    for (let i = 0; i <= 64; i++) {
      const a = i / 64 * 2 * Math.PI;
      coords.push([lng + dLng * Math.cos(a), lat + dLat * Math.sin(a)]);
    }
    return coords;
  }

  function updateAccuracy(lat, lng, accuracy) {
    const source = map && map.getSource('accuracy');
    if (!source) return;
    const radius = Math.min(Math.max(accuracy || 25, 8), 500);
    source.setData({
      type: 'Feature',
      geometry: { type: 'Polygon', coordinates: [circlePolygon(lat, lng, radius)] }
    });
  }

  function recenter(instant) {
    follow = true;
    const center = livePos ? [livePos[1], livePos[0]] : [KCC[1], KCC[0]];
    map.easeTo({
      center: center,
      zoom: Math.max(map.getZoom(), 17),
      bearing: 0,
      pitch: 0,
      duration: instant ? 0 : 650
    });
    recenterBtn.classList.add('active');
    setTimeout(function () { recenterBtn.classList.remove('active'); }, 800);
  }

  function onFix(position) {
    if (!watching) return;
    const coords = position.coords;
    livePos = [coords.latitude, coords.longitude];
    liveAccuracy = coords.accuracy;
    marker.setLngLat([livePos[1], livePos[0]]);
    updateAccuracy(livePos[0], livePos[1], liveAccuracy);
    setStatus(
      'GPS signal acquired',
      'Accuracy ±' + Math.round(liveAccuracy) + ' m • ' + livePos[0].toFixed(6) + ', ' + livePos[1].toFixed(6),
      'live'
    );
    if (follow) {
      map.easeTo({
        center: [livePos[1], livePos[0]],
        zoom: Math.max(map.getZoom(), 17),
        duration: 700
      });
    }
  }

  function stopWatch() {
    if (watchId != null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    watching = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  function onGpsError(error) {
    if (error.code === error.TIMEOUT && watching) {
      setStatus('Still locating…', 'GPS is taking longer than usual. Move to an open area.', 'live');
      return;
    }
    stopWatch();
    setStatus(
      'Lost GPS signal. Getting LBS data',
      error.code === error.PERMISSION_DENIED
        ? 'Location permission denied — allow access and tap START.'
        : 'Showing KCC campus until GPS is available.',
      'lost'
    );
    showToast('GPS signal unavailable.');
  }

  function startTracking() {
    if (!navigator.geolocation) {
      setStatus('GPS not supported', 'This browser does not support geolocation.', 'off');
      return;
    }
    if (watching) return;
    watching = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    setStatus('Locating…', 'Requesting a GPS fix from your device.', 'live');
    watchId = navigator.geolocation.watchPosition(onFix, onGpsError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 20000
    });
  }

  function stopTracking() {
    stopWatch();
    setStatus(
      livePos ? 'GPS stopped' : 'Lost GPS signal. Getting LBS data',
      livePos ? 'Last known position retained on the map.' : 'Showing KCC campus until GPS is available.',
      livePos ? 'off' : 'lost'
    );
    showToast('Tracking stopped.');
  }

  function shareLocation() {
    if (!livePos) {
      showToast('Start tracking to share your live location.');
      return;
    }
    const url = 'https://www.google.com/maps?q=' + livePos[0].toFixed(6) + ',' + livePos[1].toFixed(6);
    const text = 'My live location: ' + livePos[0].toFixed(6) + ', ' + livePos[1].toFixed(6) + ' ' + url;
    if (navigator.share) {
      navigator.share({ title: 'My live location', text: text, url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('Live location copied to clipboard.');
      }).catch(function () {
        showToast(text);
      });
      return;
    }
    showToast(text);
  }

  if (!window.maplibregl) {
    document.getElementById('gps-map').innerHTML =
      '<div style="padding:2rem;color:#0f172a;font-weight:700">Map engine failed to load. Check your internet connection and refresh.</div>';
    return;
  }

  map = new maplibregl.Map({
    container: 'gps-map',
    style: {
      version: 8,
      sources: {
        streets: {
          type: 'raster',
          tiles: ['https://a.tile.opentopomap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          maxzoom: 17,
          attribution: '&copy; OpenTopoMap (CC-BY-SA)'
        },
        satellite: {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          maxzoom: 18,
          attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
        }
      },
      layers: [
        { id: 'streets', type: 'raster', source: 'streets' },
        { id: 'satellite', type: 'raster', source: 'satellite', layout: { visibility: 'none' } }
      ]
    },
    center: [KCC[1], KCC[0]],
    zoom: 17,
    attributionControl: false,
    antialias: true
  });

  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'top-left');

  const dotEl = document.createElement('div');
  dotEl.className = 'gps-dot';
  marker = new maplibregl.Marker({ element: dotEl, anchor: 'center' })
    .setLngLat([KCC[1], KCC[0]])
    .addTo(map);

  map.on('load', function () {
    map.addSource('accuracy', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });
    map.addLayer({
      id: 'accuracy-fill',
      type: 'fill',
      source: 'accuracy',
      paint: { 'fill-color': '#2563eb', 'fill-opacity': 0.12 }
    });
    map.addLayer({
      id: 'accuracy-line',
      type: 'line',
      source: 'accuracy',
      paint: { 'line-color': '#2563eb', 'line-width': 1, 'line-opacity': 0.4 }
    });
  });

  map.on('dragstart', function () {
    follow = false;
  });

  startBtn.addEventListener('click', startTracking);
  stopBtn.addEventListener('click', stopTracking);
  shareBtn.addEventListener('click', shareLocation);
  shareTopBtn.addEventListener('click', shareLocation);
  recenterBtn.addEventListener('click', function () { recenter(false); });
  statusRecentBtn.addEventListener('click', function () { recenter(false); });

  layersBtn.addEventListener('click', function () {
    satellite = !satellite;
    map.setLayoutProperty('streets', 'visibility', satellite ? 'none' : 'visible');
    map.setLayoutProperty('satellite', 'visibility', satellite ? 'visible' : 'none');
    layersBtn.classList.toggle('active', satellite);
    showToast(satellite ? 'Satellite view' : 'Street map view');
  });

  compassBtn.addEventListener('click', function () {
    map.easeTo({ bearing: 0, pitch: 0, duration: 500 });
    showToast('Compass reset to north.');
  });

  window.addEventListener('beforeunload', function () {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
  });
})();
</script>
{% endblock %}
